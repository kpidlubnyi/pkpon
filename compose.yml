#TODO: remove ports in the end of dev

services:
  core:
    build:
      context: ./backend
    container_name: core
    volumes:
      - ./backend/core:/back
      - logs_volume:/back/logs
      - flags_volume:/back/flags
    ports:
      - "8001:8000"
    networks:
      - app-network
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py create_gtfs_task -e 15 -p "minutes" &&
      python manage.py create_map_task -e 3 -p "days" &&
      python manage.py tasks_initial_run &&
      exec gunicorn core.wsgi:application -c gunicorn.conf.py
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres-db:
    image: postgres:16
    container_name: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    ports:
      - "5433:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h ${DB_HOST} -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:8
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
      - ./backend/mongod.conf:/etc/mongod.conf
    command: ['mongod', '--config', "/etc/mongod.conf"]
    networks:
      - app-network
    ports:
      - 27018:27017
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - app-network
    ports:
      - 6380:6379
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: ./backend
    container_name: celery-worker
    volumes:
      - ./backend/core:/back
      - logs_volume:/back/logs
      - flags_volume:/back/flags
    depends_on:
      core:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: celery -A core worker --loglevel=info
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery-beat:
    build:
      context: ./backend
    container_name: celery-beat
    entrypoint: []
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend/core:/back
      - logs_volume:/back/logs
    depends_on:
      celery-worker:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped

  orr:
    build: 
      context: ./OpenRailRouting
    container_name: orr
    volumes:
      - flags_volume:/opt/orr/flags
    environment:
      - JAVA_OPTS=-Xms1000m -Xmx2500m
      - ORR_NEW_MAP_FLAG_FILE
      - ORR_GRAPH_READY_FLAG_FILE
      - OSM_POLAND_URL
    networks:
      - app-network
    ports:
      - "9002:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 3m


volumes:
  pg_data:
  mongo_data:
  redis_data:
  logs_volume:
  flags_volume:

networks:
  app-network:
    driver: bridge